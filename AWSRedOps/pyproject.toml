[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awsredops"
version = "1.0.0"
description = "Permissioned AWS identity and infrastructure security assessment CLI"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "AWSRedOps contributors"}]
dependencies = ["boto3>=1.35,<2", "requests>=2.32,<3", "playwright>=1.50,<2", "keyring>=25,<27", "cryptography>=43,<49"]

[project.optional-dependencies]
test = ["pytest>=8", "botocore>=1.35"]

[project.scripts]
awsredops = "awsredops.cli:main"

[tool.setuptools.packages.find]
include = ["awsredops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
